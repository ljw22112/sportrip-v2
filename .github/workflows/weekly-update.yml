name: 📅 매주 금요일 대회 데이터 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: 전국대회정보 수집 및 업데이트
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: ⚙️ Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏃 대회 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-events.js

      - name: 🔍 변경사항 확인
        id: diff
        run: |
          if git diff --quiet src/lib/data.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git diff src/lib/data.ts | grep -c '^+.*{id:' || echo 0)
            echo "changed=true"  >> $GITHUB_OUTPUT
            echo "count=$COUNT"  >> $GITHUB_OUTPUT
          fi

      - name: 📤 커밋 & 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.email "bot@sportrip.app"
          git config user.name  "SpoTrip Bot 🤖"

          # 수집 결과 백업
          cp src/lib/data.ts /tmp/data_new.ts

          # 원격 최신 상태로 완전 동기화
          git fetch origin main
          git reset --hard origin/main

          # 수집 결과 적용
          cp /tmp/data_new.ts src/lib/data.ts
          git add src/lib/data.ts

          # 변경 없으면 스킵
          git diff --cached --quiet && echo "변경 없음" && exit 0

          git commit -m "🤖 대회 데이터 자동 업데이트 (+${{ steps.diff.outputs.count }}건) $(date +'%Y-%m-%d')"

          # force-with-lease: 우리가 fetch한 시점 이후 변경 없으면 성공
          git push --force-with-lease origin main

      - name: ✅ 결과
        run: |
          if [ "${{ steps.diff.outputs.changed }}" == "true" ]; then
            echo "✅ ${{ steps.diff.outputs.count }}건 추가 완료 → Vercel 재배포"
          else
            echo "ℹ️  새 대회 없음"
          fi
